<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
    <script>
      // Follow the system light/dark preference (stock shadcn theme styling).
      (() => {
        const media = window.matchMedia('(prefers-color-scheme: dark)');
        const apply = () =>
          document.documentElement.classList.toggle('dark', media.matches);
        apply();
        media.addEventListener('change', apply);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!--
      The Form configuration blob. The n8n node replaces this element's content
      with the real configuration before serving the page. In standalone dev
      mode the sample fixture below is used directly.
      Keep in sync with nodes/JsonForm/sampleForm.ts (the compiled output of
      its Form definition, plus the default completion message).
    -->
    <script type="application/json" id="jsonform-config">
      {
        "schema": {
          "type": "object",
          "title": "Sample form",
          "description": "Tell us a little about yourself.",
          "properties": {
            "name": {
              "type": "string",
              "maxLength": 100
            },
            "email": {
              "type": "string",
              "maxLength": 254
            },
            "role": {
              "type": "string",
              "enum": ["Developer", "Designer", "Manager"]
            },
            "startDate": {
              "type": "string",
              "format": "date"
            },
            "newsletter": {
              "type": "boolean"
            }
          },
          "required": ["name", "email"]
        },
        "uiSchema": {
          "type": "VerticalLayout",
          "elements": [
            { "type": "Control", "scope": "#/properties/name", "label": "Full name" },
            { "type": "Control", "scope": "#/properties/email", "label": "Email" },
            { "type": "Control", "scope": "#/properties/role", "label": "Role" },
            { "type": "Control", "scope": "#/properties/startDate", "label": "Start date" },
            {
              "type": "Control",
              "scope": "#/properties/newsletter",
              "label": "Subscribe to the newsletter"
            }
          ]
        },
        "completionMessage": "Thank you! Your submission has been received."
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
